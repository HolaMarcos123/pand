name: CI

# Corre en cada push a main y en cada pull request. La idea es simple: que lo que
# rompe se vea acá y no en Vercel, que despliega sin preguntar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Dos pushes seguidos: vale el último. Cancelar el anterior ahorra minutos.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # El build no se conecta a la base, pero Prisma exige que la variable exista para
  # generar el cliente. Un valor de mentira alcanza.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  # Las públicas van en claro a propósito: son las que el browser ya ve igual. Acá
  # no se usan contra Supabase, solo tienen que existir para que el build no corte.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
  SUPABASE_SERVICE_ROLE_KEY: ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verificar:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci y no npm install: instala exactamente lo del package-lock, así que
      # una dependencia que cambió sin querer se nota acá.
      - run: npm ci

      # next-env.d.ts está gitignorado y es el que declara los tipos de los
      # imports de imágenes y de las rutas. En local existe porque lo deja el
      # último `next dev` o `next build`; en CI el repo llega sin él y `tsc` se
      # cae con "Cannot find module '…/logo.png'". typegen lo regenera sin tener
      # que hacer un build entero.
      - name: Generar tipos de Next
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests de lógica
        run: npm test

      # Va último porque es lo más lento, y porque encuentra cosas que tsc no ve:
      # un componente cliente que arrastra código de servidor al bundle del
      # browser, por ejemplo, solo se cae acá.
      - name: Build
        run: npm run build

  base:
    name: Tests contra la base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # En un pull request desde un fork los secretos no están disponibles, así que
    # este job no tendría con qué correr.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El secreto se pasa a una variable de entorno porque el contexto `secrets`
      # no se puede evaluar directamente en un `if`.
      - name: Ver si hay base configurada
        id: config
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -n "$TEST_DATABASE_URL" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin el secreto TEST_DATABASE_URL, los tests contra la base no corren. Se configura en Settings → Secrets and variables → Actions."
          fi

      # Cada test se crea su propia organización y la borra al terminar, así que no
      # toca la demo ni ninguna cartera real. Aun así conviene apuntar el secreto a
      # un proyecto de Supabase que no sea el de producción.
      - name: Tests contra la base
        if: steps.config.outputs.hay == 'si'
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm run test:db
